name: train-gpt-mini

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "训练步数"
        default: "400"
      dim:
        description: "隐藏维度"
        default: "128"
      layers:
        description: "Transformer 层数"
        default: "3"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install numpy

      - name: 生成语料
        run: python3 make_corpus.py

      - name: 训练
        # PYTHONUNBUFFERED + stdbuf 让日志实时刷出来
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          stdbuf -oL -eL python3 train.py \
            --steps ${{ inputs.steps }} \
            --dim ${{ inputs.dim }} \
            --layers ${{ inputs.layers }} \
            --batch 16 --block 64 --eval-every 50 \
            --out model.pkl 2>&1

      - name: 上传权重
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-weights
          path: |
            model.pkl
            data/tokenizer.json
          retention-days: 30
          if-no-files-found: warn
