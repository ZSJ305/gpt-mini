name: train-gpt-mini

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "训练步数"
        default: "3000"
      dim:
        description: "隐藏维度"
        default: "192"
      layers:
        description: "Transformer 层数"
        default: "4"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install numpy

      - name: 生成语料
        run: python3 make_corpus.py

      - name: 训练
        run: |
          python3 train.py \
            --steps ${{ inputs.steps }} \
            --dim ${{ inputs.dim }} \
            --layers ${{ inputs.layers }} \
            --batch 32 --block 96

      - name: 上传权重
        uses: actions/upload-artifact@v4
        with:
          name: model-weights
          path: |
            model.pkl
            data/tokenizer.json
          retention-days: 30
